<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trial Reels">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Trial Reels Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a single 600px phone-style column, sticky top bar, profile header over a 3-column reel grid, bottom tab bar, bottom sheets for detail. */
:root {
  --bg: #ffffff; --fg: #0c1014; --muted: #737373; --line: #dbdbdb; --soft: #efefef; --sheet: #ffffff;
  --accent: #1a8cff; --accent-fg: #ffffff; --danger: #e5484d; --ok: #2a9d58; --warn: #c27c0e; --star: #f2a900;
  --scrim: rgba(0, 0, 0, .5); --tile-shade: rgba(0, 0, 0, .55);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --fg: #f5f5f5; --muted: #a8a8a8; --line: #2a2a2a; --soft: #262626; --sheet: #181818;
  --accent: #3d9dff; --accent-fg: #ffffff; --danger: #ff6b6f; --ok: #4cc27a; --warn: #e3a43b; --star: #ffc93d;
  --scrim: rgba(0, 0, 0, .65); --tile-shade: rgba(0, 0, 0, .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --fg: #f5f5f5; --muted: #a8a8a8; --line: #2a2a2a; --soft: #262626; --sheet: #181818;
  --accent: #3d9dff; --accent-fg: #ffffff; --danger: #ff6b6f; --ok: #4cc27a; --warn: #e3a43b; --star: #ffc93d;
  --scrim: rgba(0, 0, 0, .65); --tile-shade: rgba(0, 0, 0, .6); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
a { color: var(--accent); text-decoration: none }
svg { display: block }

.app { max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)) }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; border-bottom: 1px solid var(--line) }
.top h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.iconbtn { border: 0; background: none; padding: 6px; border-radius: 50%; display: grid; place-items: center }
.iconbtn:disabled { opacity: .5; cursor: default }
.spin { animation: spin 1s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none } .sheet { transition: none !important } }

.jobbar { font-size: 12px; color: var(--muted); padding-block: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none }
.demo { background: var(--soft); font-size: 12px; padding-block: 8px; color: var(--muted) }

/* profile */
.prof { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; padding-block: 16px 8px }
.avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--soft) center/cover; display: grid; place-items: center; font-size: 30px; font-weight: 600; color: var(--muted); border: 1px solid var(--line) }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 4px }
.stats b { display: block; font-size: 17px; font-variant-numeric: tabular-nums }
.stats span { font-size: 13px }
.name { font-weight: 600; padding-block: 2px 12px }

.panel { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 14px }
.panel .txt { flex: 1; min-width: 0 }
.panel .t { font-weight: 600 }
.panel .s { color: var(--muted); font-size: 13px }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line) }
.tab { border: 0; background: none; padding: 11px 0 10px; display: flex; justify-content: center; align-items: center; gap: 6px; color: var(--muted); border-top: 1px solid transparent; margin-top: -1px; font-size: 12px; font-weight: 600; letter-spacing: .3px }
.tab[aria-selected="true"] { color: var(--fg); border-top-color: var(--fg) }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px }
.tile { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border: 0; padding: 0; background: var(--soft) center/cover no-repeat; overflow: hidden; color: #fff; text-align: left }
.tile .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 10px; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.25; text-shadow: 0 1px 2px rgba(0,0,0,.35) }
.tile .views { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 3px; align-items: center; font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-variant-numeric: tabular-nums }
.tile .badges { position: absolute; top: 6px; left: 6px; right: 6px; display: flex; justify-content: space-between; gap: 4px }
.pill { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--tile-shade); color: #fff; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap }
.pill.star { color: var(--star) }
.pill.next { background: var(--accent); color: var(--accent-fg) }
.tile.off::after { content: ""; position: absolute; inset: 0; background: var(--scrim) }
.tile .officon { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1 }

.empty { text-align: center; padding: 48px 24px; color: var(--muted) }
.empty h2 { color: var(--fg); font-size: 20px; margin: 12px 0 6px }

/* lists */
.sec { font-size: 13px; font-weight: 600; color: var(--muted); padding-block: 22px 8px; letter-spacing: .2px }
.list { display: grid }
.row { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); min-height: 52px }
.row:last-child { border-bottom: 0 }
.row .txt { flex: 1; min-width: 0 }
.row .t { font-size: 15px }
.row .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere }
.thumb { width: 44px; height: 58px; border-radius: 6px; background: var(--soft) center/cover; flex: none; position: relative; overflow: hidden }
.qtime { font-weight: 600; font-variant-numeric: tabular-nums }

.switch { position: relative; width: 50px; height: 30px; flex: none }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1 }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s }
.switch input:checked + span { background: var(--accent) }
.switch input:checked + span::after { transform: translateX(20px) }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px }

.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; flex: none }
.stepper button { border: 0; background: none; width: 36px; height: 34px; display: grid; place-items: center }
.stepper button:disabled { opacity: .35; cursor: default }
.stepper output { min-width: 30px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums }

.btn { border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; background: var(--soft); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px }
.btn.primary { background: var(--accent); color: var(--accent-fg) }
.btn.danger { background: none; color: var(--danger); padding-inline: 0 }
.btn:disabled { opacity: .5; cursor: default }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-block: 12px }
.mini { border: 1px solid var(--line); background: none; border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; flex: none }
.mini:disabled { opacity: .3; cursor: default }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--soft); color: var(--fg) }
.chip.blue { color: var(--accent) } .chip.red { color: var(--danger) } .chip.green { color: var(--ok) } .chip.amber { color: var(--warn) }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 4px }
.toggle-chip { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted) }
.toggle-chip[aria-pressed="true"] { border-color: var(--fg); color: var(--fg) }

input.field, textarea.field, select.field { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--bg) }
textarea.field { min-height: 84px; resize: vertical }
input[type="time"].field { width: auto }
.note { font-size: 12px; color: var(--muted); padding-block: 4px }
.note.warn { color: var(--warn) }
.radio { display: flex; gap: 10px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line) }
.radio input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0 }
.log { font-size: 12px; color: var(--muted); display: grid; gap: 6px; padding-block: 6px }
.log .err { color: var(--danger) }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px) }
.nav .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: 52px }
.nav button { border: 0; background: none; display: grid; place-items: center; color: var(--fg); position: relative }
.nav .badge { position: absolute; top: 9px; left: calc(50% + 6px); width: 8px; height: 8px; border-radius: 50%; background: var(--danger) }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center }
.sheet { width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; background: var(--sheet); border-radius: 14px 14px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateY(0); transition: transform .22s ease-out }
.handle { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 4px }
.shead { display: flex; gap: 12px; padding-block: 10px; align-items: flex-start }
.shead .thumb { width: 72px; height: 96px; border-radius: 8px }
.shead .meta { flex: 1; min-width: 0 }
.shead .v { font-weight: 700; font-size: 16px }
.cap { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere }
.confirm { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-block: 8px; display: grid; gap: 10px }
.preview { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; margin-block: 8px }
.preview video { width: 100%; max-height: 60vh; border-radius: 8px; background: #000 }
.fakevid { aspect-ratio: 9 / 16; max-height: 50vh; max-width: 100%; margin: 0 auto; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 700; text-align: center; padding: 20px; font-size: 18px }
.stats4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding-block: 4px 2px }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0 }
.stat b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.3px }
.stat span { font-size: 12px; color: var(--muted) }
.verdict { font-size: 15px; line-height: 1.45; padding-block: 4px 10px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.seg button { border: 0; background: none; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--fg) }
.signal { display: flex; gap: 10px; align-items: flex-start; padding-block: 8px; border-bottom: 1px solid var(--line) }
.signal:last-child { border-bottom: 0 }
.signal i { font-style: normal; font-weight: 700; width: 18px; flex: none; text-align: center }
.up { color: var(--ok) } .down { color: var(--danger) } .flat { color: var(--muted) }
.metrics { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.chart text { font-size: 10px; fill: var(--muted) }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px) }
</style>

<div class="app" id="app"></div>
<nav class="nav" aria-label="Sections"><div class="in" id="nav"></div></nav>

/* Mirrors studio/planner.py so the dashboard shows exactly what the worker will do.
   Works in the browser (window.TRS_PLANNER) and in Node (module.exports) for tests. */
(function (root) {
  "use strict";
  const EDIT_TYPES = ["opening", "subtitles", "background", "comment"];
  const WINNER_MIN_VIEWS = 10000, WINNER_SHARE = 0.5, WINNER_WINDOW_DAYS = 10;
  const HOUR = 36e5, DAY = 864e5;

  function parseTs(ts) {
    if (ts == null) return NaN;
    if (typeof ts === "number") return ts;
    let t = String(ts).replace("Z", "+0000");
    if (/[+-]\d{4}$/.test(t)) t = t.slice(0, -2) + ":" + t.slice(-2);
    if (!/[+-]\d\d:\d\d$/.test(t)) t += "Z";
    return Date.parse(t);
  }
  const successful = (posts) => posts.filter((p) => p.status === "posted");
  function usesBySource(posts) {
    const out = {};
    for (const p of successful(posts)) (out[p.source_id] = out[p.source_id] || []).push(parseTs(p.created_at));
    return out;
  }
  const capFor = (m, s) => (m.variants_override ? Number(m.variants_override) : Number(s.variants_per_post));
  const hasSource = (m) => !!(m.has_url || m.original || m.has_original || m.media_url || m.original_file);

  function recipesFor(m, s) {
    if (!m.analyzed) return null;
    const ed = s.edits && s.edits.length ? s.edits : EDIT_TYPES;
    const subs = !!m.has_speech && !m.has_text && ed.includes("subtitles");
    const opening = !!m.opening_ok && ed.includes("opening");
    const comment = !!m.comment_ok && ed.includes("comment");
    const bg = ed.includes("background");
    const sr = m.skip_rate;
    const slow = sr == null || sr >= 50;
    const openR = subs ? ["opening", "subtitles"] : ["opening"];
    const out = [];
    if (opening && slow) out.push(openR);
    if (subs) out.push(["subtitles"]);
    if (bg) out.push(["background"]);
    if (comment) out.push(["comment"]);
    if (bg && subs) out.push(["background", "subtitles"]);
    if (opening && !slow) out.push(openR);
    if (comment && bg) out.push(["background", "comment"]);
    return out.length ? out : [["subtle"]];
  }
  function recipeFor(i, m, s) { const r = recipesFor(m, s); return r ? r[i % r.length] : null; }

  function isWinner(m, posts, s, at) {
    if (s.winners_first === false) return false;
    const mine = successful(posts).filter((p) => p.source_id === m.id);
    if (!mine.length) return false;
    const last = mine.reduce((a, b) => (parseTs(b.created_at) > parseTs(a.created_at) ? b : a));
    if (at - parseTs(last.created_at) > WINNER_WINDOW_DAYS * DAY) return false;
    const v = last.variant_views;
    if (v == null) return false;

  }

    const base = { uses: n, cap, eligible: false, reason: "", ready_at: null, winner };
    if (m.is_variant) return { ...base, reason: "Trial reel made by this app" };
    if (m.available === 0 || m.available === false) return { ...base, reason: "No longer on your profile" };
    if (m.excluded) return { ...base, reason: "Omitted" };
    if (!hasSource(m)) return { ...base, reason: "Uses licensed music, upload the original to include it" };

    D.music = Array.isArray(music) ? music.filter((f) => /\.(mp3|m4a|wav|aac)$/i.test(f.name)).map((f) => ({ name: f.name, sha: f.sha, size: f.size })) : [];
    D.secrets = {};
    for (const x of secrets.secrets || []) D.secrets[x.name] = x;
    if (D.thumbsSync !== cat.last_sync) {
      D.thumbs = await readJSON("data/thumbs.json", {});
      D.thumbsSync = cat.last_sync;
    }
  }

  async function jobState() {
    let runs = [];
    try { runs = (await gh("GET", `${R()}/actions/workflows/${WORKFLOW}/runs?per_page=10`)).workflow_runs || []; } catch (e) { return null; }
    const kindOf = (r) => {
      const t = (r.display_title || "").split(" ")[0];
      return { tick: "check", sync: "sync", preview: "preview", post: "post", "refresh-token": "refresh" }[t] || "check";
    };
    if (pending) {
      const found = runs.find((r) => (r.display_title || "").includes(pending.req));
      if (found) { watching = found.id; pending = null; }
      else if (Date.now() - pending.at > 120000) pending = null;
    }
    const active = runs.find((r) => r.status !== "completed");
    if (watching) {
      const w = runs.find((r) => r.id === watching);
      if (w && w.status === "completed") {
        lastFinished = { kind: kindOf(w), conclusion: w.conclusion, url: w.html_url, at: Date.now() };
        watching = null;
        needReload = true;
      }
    }
    if (active) lastActive = active.id;
    else if (lastActive) { lastActive = null; needReload = true; }
    if (pending) return { kind: pending.kind === "refresh-token" ? "refresh" : pending.kind, detail: "Asking GitHub to start it", started: new Date(pending.at).toISOString() };
    if (active) {
      const mins = Math.max(0, Math.round((Date.now() - Date.parse(active.run_started_at || active.created_at)) / 60000));
      const detail = active.status === "in_progress" ? `Running on GitHub${mins ? ", " + mins + " min so far" : ""}` : "Waiting for GitHub to start it";
      return { kind: kindOf(active), detail, started: active.created_at, url: active.html_url };
    }
    return null;
  }
  function lastError() {
    if (!lastFinished || lastFinished.conclusion === "success" || Date.now() - lastFinished.at > 60000) return null;
    if (lastFinished.conclusion === "cancelled") return "That task was replaced by a newer one. Try again.";
    const le = D.status.last_error;
    if (le && Date.now() - P.parseTs(le.ts) < 30 * 60000) return le.message;
    return "The run didn't finish. Details are in the Actions tab on GitHub.";
  }

  async function api(method, path, body) {
    const now = Date.now();
    const s = settings();
    const mm = path.match(/^\/api\/media\/([^/]+)(\/\w+)?$/);
    if (path === "/api/state" && method === "GET") {
      const job = await jobState();
      const day = P.localDay(now, s), slots = P.slotsForDay(day, s), done = P.postsOnDay(D.history, day, s).length;
      const g = D.status.guard || null;
      const blocked = P.guardBlocks(g, s);
      const next = blocked ? null : slots.find((t, i) => i >= done && t > now);
      const ig = D.secrets.IG_ACCESS_TOKEN;
      let days = null;
      if (D.status.token && D.status.token.expires_at) days = Math.max(0, Math.floor((P.parseTs(D.status.token.expires_at) - now) / 864e5));
      else if (ig) days = Math.max(0, 60 - Math.floor((now - P.parseTs(ig.updated_at)) / 864e5));
      const thumbs = D.thumbs || {};
      return { account: { ...(D.catalog.account || {}), avatar: thumbs.avatar || null }, settings: s,
               instagram: { connected: !!ig, days_left: days }, claude_key: !!D.secrets.ANTHROPIC_API_KEY,
               today: { posted: done, planned: slots.length, next: next ? new Date(next).toISOString() : null },
               last_sync: D.catalog.last_sync, job, last_error: job ? null : lastError(), hard_max: 10,
               repo: cfg.repo, minutes: P.minutesEstimate(s),
               guard: g ? { paused: !!g.paused, blocks: blocked, reasons: g.reasons || [], since: g.since, checked_at: g.checked_at } : null,
               music: D.music };
    }
    if (path === "/api/media" && method === "GET") {
      const list = media(), uses = P.usesBySource(D.history);
      const next = {};
      for (const q of P.simulate(list, D.history, s, now, 60)) if (!next[q.media_id]) next[q.media_id] = q.time;
      const out = list.filter((m) => !m.is_variant && m.available !== 0).map((m) => {
        const u = uses[m.id] || [], c = D.controls[m.id] || {};
        return { ...m, thumb: D.thumbs[m.id] || null, licensed: !m.has_url, has_original: m.original,
          status: P.status(m, u, s, now, P.isWinner(m, D.history, s, now)), next_at: next[m.id] || null,
          next_recipe: P.recipeFor(u.length, m, s), analysis: D.analysis[m.id] || null,
          next_caption: c.next_caption && c.next_caption_use === u.length ? c.next_caption : null,
          preview: D.previews[m.id] || null };
      });
      out.sort((a, b) => (a.timestamp < b.timestamp ? 1 : -1));
      return { media: out };
    }
    if (path === "/api/queue") return { queue: P.simulate(media(), D.history, s, now, 14) };
    if (path === "/api/posts") return { posts: D.history.slice().reverse().map((p) => ({ ...p, thumb: D.thumbs[p.source_id] || null })) };
    if (path === "/api/log") return { log: (D.status.log || []).slice().reverse() };
    if (path === "/api/results") {
      const out = P.results(media(), D.history, D.status, s, now);
      out.minutes = await minutesThisMonth();
      return out;
    }
    if (path === "/api/insights") {
      const reach = Object.entries(D.status.reach || {}).sort().map(([d, v]) => ({ day: d, value: v }));
      return { edits: P.editStats(media(), D.history), reach, guard: D.status.guard || null };
    }
    if (path === "/api/guard/resume" && method === "POST") {
      const next = { ...D.settings, guard_ack: new Date().toISOString() };
      await writeJSON("data/settings.json", next, "Dashboard: resume after safety check");
      D.settings = next;
      return { ok: true };
    }
    if (path === "/api/music" && method === "POST") {
      const file = body.get("file");
      if (file.size > 20 * 1024 * 1024) throw new Error("Keep music files under 20 MB.");
      const name = file.name.replace(/[^\w.\- ]+/g, "").replace(/\s+/g, "-") || "track.mp3";
      await writeBinary(`music/${name}`, file, "Dashboard: add music");
      await loadAll();
      return { ok: true };
    }
    const mu = path.match(/^\/api\/music\/(.+)$/);
    if (mu && method === "DELETE") {
      const f = D.music.find((x) => x.name === decodeURIComponent(mu[1]));
      if (f) await gh("DELETE", `${R()}/contents/music/${encodeURIComponent(f.name)}`, { message: "Dashboard: remove music", sha: f.sha, branch: "main" });
      await loadAll();
      return { ok: true };
    }
    if (path === "/api/settings" && method === "PUT") {
      const RANGES = { posts_per_day: [0, 10], variants_per_post: [1, 20], cooldown_days: [1, 90], min_age_days: [0, 365] };
      const next = { ...D.settings };
      for (const [k, v0] of Object.entries(body)) {
        if (!(k in (D.defaults || {}))) continue;
        let v = v0;
        if (RANGES[k]) v = Math.max(RANGES[k][0], Math.min(parseInt(v, 10) || 0, RANGES[k][1]));
        if (k === "edits") v = P.EDIT_TYPES.filter((x) => v.includes(x));
        if (k === "music" && !["off", "library", "ambient"].includes(v)) continue;
        if (k === "hook_mode" && !["move", "repeat"].includes(v)) continue;
        next[k] = v;
      }
      await writeJSON("data/settings.json", next, "Dashboard: settings");
      D.settings = next;
      return { settings: settings() };
    }
    if (path === "/api/priority" && method === "POST") {
      const c = { ...D.controls };
      for (const id of Object.keys(c)) if (c[id].priority != null) c[id] = { ...c[id], priority: null };
      body.ids.forEach((id, i) => { c[id] = { ...(c[id] || {}), priority: i + 1 }; });
      await writeJSON("data/controls.json", c, "Dashboard: priority order");
      D.controls = c;
      return { ok: true };
    }
    if (path === "/api/sync") return dispatch("sync");
    if (path === "/api/refresh-token") { await dispatch("refresh-token"); return { refreshed: "started" }; }
    if (path === "/api/secrets") {
      if (body.ig_token) { await setSecret("IG_ACCESS_TOKEN", body.ig_token); await loadAll(); await dispatch("sync"); }
      if (body.anthropic_key !== undefined) {
        if (body.anthropic_key) await setSecret("ANTHROPIC_API_KEY", body.anthropic_key);
        else await gh("DELETE", `${R()}/actions/secrets/ANTHROPIC_API_KEY`).catch(() => {});
      }
      await loadAll();
      return { ok: true };
    }
    if (path === "/logout") { disconnect(); return { ok: true }; }
    if (mm) {
      const id = mm[1];
      if (method === "PATCH") {
        const c = { ...D.controls }, cur = { ...(c[id] || {}) };
        if ("excluded" in body) cur.excluded = !!body.excluded;
        if ("prioritized" in body) {
          if (body.prioritized && cur.priority == null) cur.priority = Math.max(0, ...Object.values(c).map((x) => x.priority || 0)) + 1;
          if (!body.prioritized) cur.priority = null;
        }
        if ("variants_override" in body) cur.variants_override = body.variants_override ? Math.max(1, Math.min(20, +body.variants_override)) : null;
        c[id] = cur;
        await writeJSON("data/controls.json", c, "Dashboard: reel settings");
        D.controls = c;
        return { ok: true };
      }
      if (mm[2] === "/preview") return dispatch("preview", id);
      if (mm[2] === "/caption") {
        const c = { ...D.controls }, use = (P.usesBySource(D.history)[id] || []).length;
        c[id] = { ...(c[id] || {}), next_caption: body.caption || null, next_caption_use: body.caption ? use : null };
        await writeJSON("data/controls.json", c, "Dashboard: caption for the next version");
        D.controls = c;
        return { ok: true };
      }
      if (mm[2] === "/post") return dispatch("post", id);
      if (mm[2] === "/original") {
        const file = body.get("file");
        if (file.size > 40 * 1024 * 1024) throw new Error("That file is over 40 MB. Export a smaller version and try again.");
        await writeBinary(`originals/${id}.mp4`, file, "Dashboard: original video");
        const c = { ...D.controls };
        c[id] = { ...(c[id] || {}), original: true };
        await writeJSON("data/controls.json", c, "Dashboard: original video");
        D.controls = c;
        return { ok: true };
      }
    }
    throw new Error("Unknown request " + path);
  }

  let minutesCache = null;
  async function minutesThisMonth() {
    if (minutesCache && Date.now() - minutesCache.at < 10 * 60000) return minutesCache.value;
    const d = new Date(), month = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-01`;
    let used = 0, runs = 0;
    try {
      for (let page = 1; page <= 10; page++) {
        const r = await gh("GET", `${R()}/actions/runs?created=%3E%3D${month}&per_page=100&page=${page}`);
        for (const x of r.workflow_runs || []) {
          if (x.status !== "completed" || !x.run_started_at) continue;
          runs += 1;
          used += Math.max(1, Math.ceil((Date.parse(x.updated_at) - Date.parse(x.run_started_at)) / 60000));
        }
        if (!r.workflow_runs || r.workflow_runs.length < 100) break;
      }
    } catch (e) { return null; }
    minutesCache = { at: Date.now(), value: { used, runs, limit: 2000 } };
    return minutesCache.value;
  }

  async function previewUrl(id, madeAt) {
    const key = id + "|" + madeAt;
    if (!previewUrls[key]) {
      const blob = await gh("GET", `${R()}/contents/${id}.mp4?ref=previews`, undefined, { accept: "application/vnd.github.raw", blob: true });
      previewUrls[key] = URL.createObjectURL(new Blob([blob], { type: "video/mp4" }));
    }
    return previewUrls[key];
  }

  async function connect(token, repo) {
    const old = { ...cfg };
    cfg.token = token.trim(); cfg.repo = repo.trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, "");
    try {
      const info = await gh("GET", R());
      if (!info.private) throw new Error("That repository is public. Make it private first so your data stays yours.");
      await gh("GET", `${R()}/actions/secrets/public-key`);
      await setSecret("GH_PAT", cfg.token); // lets the worker save renewed Instagram tokens
    } catch (e) { Object.assign(cfg, old); throw e; }
    LS.set("trs-token", cfg.token); LS.set("trs-repo", cfg.repo);
  }
  function disconnect() { LS.del("trs-token"); cfg.token = ""; }

  window.TRS_BACKEND = {
    configured: () => !!(cfg.token && cfg.repo),
    repo: () => cfg.repo,
    async api(method, path, body) {
      if (method === "GET" && path === "/api/state" && (!D.defaults || needReload)) {
        needReload = false;
        reloading = loadAll().finally(() => { reloading = null; });
      }
      if (reloading) await reloading;
      return api(method, path, body);
    },
    loadAll, previewUrl, connect, disconnect,
  };
})();

</script>

/* ---------- helpers ---------- */
const h = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
const num = (n) => (n == null ? "--" : nf.format(n));
const tz = () => (ST.state && ST.state.settings.timezone) || undefined;
function fmtTime(iso, withDay = true) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const day = (x) => new Intl.DateTimeFormat("en-CA", { timeZone: tz(), year: "numeric", month: "2-digit", day: "2-digit" }).format(x);
  const t = new Intl.DateTimeFormat("en-US", { timeZone: tz(), hour: "numeric", minute: "2-digit" }).format(d);
  if (!withDay) return t;
  const tomorrow = new Date(now.getTime() + 864e5), yesterday = new Date(now.getTime() - 864e5);
  if (day(d) === day(now)) return "Today, " + t;
  if (day(d) === day(tomorrow)) return "Tomorrow, " + t;
  if (day(d) === day(yesterday)) return "Yesterday, " + t;
  return new Intl.DateTimeFormat("en-US", { timeZone: tz(), weekday: "short", month: "short", day: "numeric" }).format(d) + ", " + t;
}
function fmtDate(iso) {
  if (!iso) return "";
  return new Intl.DateTimeFormat("en-US", { timeZone: tz(), month: "short", day: "numeric", year: "numeric" }).format(new Date(iso.replace(/\+0000$/, "Z")));
}
const byId = (id) => ST.media.find((m) => m.id === id);
function hue(id) { let x = 0; for (const c of id) x = (x * 31 + c.charCodeAt(0)) % 360; return x; }
function tileBg(m) {

}

  return `<span class="ph">${h(words)}</span>`;

/* ---------- API ---------- */
const BACK = window.TRS_BACKEND;
const api = DEMO ? (m, p, b) => window.TRS_MOCK(m, p, b) : (m, p, b) => BACK.api(m, p, b);

async function load(all = true) {
  const tasks = [api("GET", "/api/state").then((d) => (ST.state = d))];
  if (all) tasks.push(
    api("GET", "/api/media").then((d) => (ST.media = d.media)),
    api("GET", "/api/posts").then((d) => (ST.posts = d.posts)),
    api("GET", "/api/queue").then((d) => (ST.queue = d.queue)));
  if (all && ST.view === "settings") tasks.push(api("GET", "/api/log").then((d) => (ST.log = d.log)));
  if (all) tasks.push(api("GET", "/api/insights").then((d) => (ST.insights = d)).catch(() => {}));
  if (all) tasks.push(api("GET", "/api/results").then((d) => (ST.results = d)).catch(() => {}));
  await Promise.all(tasks);
  render();
}
let wasBusy = false;
async function poll() {
  try {
    await api("GET", "/api/state").then((d) => (ST.state = d));
    const busy = !!ST.state.job;
    if (wasBusy && !busy) {
      await load(true);
      if (ST.state.last_error) toast(ST.state.last_error); else if (ST.busyAction) toast(ST.busyAction + " finished");
      ST.busyAction = null;
    } else renderTop();
    wasBusy = busy;
  } catch (e) { /* keep polling */ }
  setTimeout(poll, wasBusy ? 4000 : 30000);
}
async function start(path, label) {
  try {
    await api("POST", path); ST.busyAction = label; wasBusy = true;
    await api("GET", "/api/state").then((d) => (ST.state = d)); render();
    setTimeout(poll, 4000);
  } catch (e) { toast(e.message); }
}
async function saveSetting(key, value) {
  try {
    const d = await api("PUT", "/api/settings", { [key]: value });
    ST.state.settings = d.settings; toast("Saved");
    await load(true);
  } catch (e) { toast(e.message); }
}
async function patchMedia(id, body) {
  try { await api("PATCH", "/api/media/" + id, body); await load(true); } catch (e) { toast(e.message); }
}

function guardBanner() {
  const g = ST.state && ST.state.guard;

function scheduleLine() {

  if (!set.enabled) return "Paused. Nothing will post until you turn this on.";
  if (set.posts_per_day === 0) return "Set to 0 a day, so nothing will post";
  const per = `${set.posts_per_day} a day`;
  const next = s.today.next ? `next ${fmtTime(s.today.next)}` : (ST.queue[0] ? `next ${fmtTime(ST.queue[0].time)}` : "nothing ready to post");

function statusChipText(m) {

const pct = (x) => (x == null ? "--" : (x >= 0 ? "+" : "") + Math.round(x * 100) + "%");
function lineChart(points, markerDay, label, fromZero = true) {
  if (!points || points.length < 2) return "";
  const W = 340, H = 96, L = 4, R = 4, T = 16, B = 18;
  const vals = points.map((p) => p.value);
  let lo = fromZero ? 0 : Math.min(...vals), hi = Math.max(...vals, 1);
  if (!fromZero) { const pad = Math.max(1, (hi - lo) * 0.1); lo -= pad; hi += pad; }
  const x = (i) => L + (i / (points.length - 1)) * (W - L - R), y = (v) => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join("");
  const last = points.length - 1;
  let mark = "";
  const mi = markerDay ? points.findIndex((p) => p.day >= markerDay) : -1;
  if (mi > 0) mark = `<line x1="${x(mi)}" x2="${x(mi)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3"></line>
    <text x="${Math.min(x(mi) + 4, W - 60)}" y="${T - 5}">Started</text>`;
  const fmtD = (dd) => new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", timeZone: "UTC" }).format(new Date(dd + "T12:00:00Z"));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${h(label)}">
    <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"></line>
    <path d="${d}L${x(last)},${H - B}L${x(0)},${H - B}Z" fill="var(--accent)" opacity=".12"></path>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"></path>
    <circle cx="${x(last)}" cy="${y(points[last].value)}" r="3.5" fill="var(--accent)"></circle>${mark}
    <text x="${L}" y="${H - 4}">${h(fmtD(points[0].day))}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${h(fmtD(points[last].day))}</text></svg>`;
}
function metricsLine(p) {
  const m = p.metrics || {};
  const bits = [];
  if (p.variant_views != null) bits.push(`<b style="color:var(--fg)">${h(num(p.variant_views))}</b> views`);
  if (m.reach != null) bits.push(`${h(num(m.reach))} reached`);
  if (m.likes != null) bits.push(`${h(num(m.likes))} likes`);
  if (m.shares != null) bits.push(`${h(num(m.shares))} shares`);
  if (m.saved != null) bits.push(`${h(num(m.saved))} saves`);
  if (m.skip_rate != null) bits.push(`${Math.round(m.skip_rate)}% swiped away early`);
  if (m.avg_watch_ms != null) bits.push(`${(m.avg_watch_ms / 1000).toFixed(1)}s avg watch`);
  const c = p.checks || {};
  if (c.d1 != null) bits.push(`day 1: ${h(num(c.d1))}${c.d3 != null ? `, day 3: ${h(num(c.d3))}` : ""}${c.d7 != null ? `, day 7: ${h(num(c.d7))}` : ""}`);
  return bits.length ? `<div class="metrics">${bits.map((b) => `<span>${b}</span>`).join("")}</div>` : `<div class="s">Results appear after the next sync</div>`;
}
function verdictText(r, w) {
  const parts = [];
  if (!w.count) return "No trial reels in this period yet.";
  parts.push(`${w.count} trial reel${w.count === 1 ? "" : "s"} brought in ${num(w.views)} views`);
  if (r.typical != null && w.measured) parts.push(`${w.beat} beat your typical reel (${num(r.typical)} views)`);
  let txt = parts.join(", and ") + ".";
  if (r.reach_cmp && r.reach_cmp.change != null) txt += ` Reach to non-followers is ${r.reach_cmp.change >= 0 ? "up" : "down"} ${Math.abs(Math.round(r.reach_cmp.change * 100))}% compared with the 30 days before you started.`;
  if (r.followers_cmp && r.followers_cmp.gained) txt += ` You've ${r.followers_cmp.gained >= 0 ? "gained" : "lost"} ${num(Math.abs(r.followers_cmp.gained))} followers since then.`;
  return txt;
}
function signalsHtml(r, w) {
  const rows = [];
  const sig = (dir, title, detail) => rows.push(`<div class="signal"><i class="${dir}" aria-hidden="true">${dir === "up" ? "&#9650;" : dir === "down" ? "&#9660;" : "&#8226;"}</i><div class="txt"><div class="t">${h(title)}</div><div class="s">${h(detail)}</div></div></div>`);
  if (r.reach_cmp) {
    const c = r.reach_cmp.change;
    sig(c > 0.1 ? "up" : c < -0.1 ? "down" : "flat", `Non-follower reach ${pct(c)}`, `${num(r.reach_cmp.before)} a day in the 30 days before, ${num(r.reach_cmp.after)} a day since (${r.reach_cmp.days_after} days).`);
  } else sig("flat", "Non-follower reach", "Needs a week of history before and 3 days after starting to compare.");
  if (r.typical != null && w.median != null) {
    const ratio = w.median / r.typical;
    sig(ratio >= 0.5 ? "up" : ratio < 0.15 ? "down" : "flat", `Median trial reel: ${num(w.median)} views`, `${Math.round(ratio * 100)}% of your typical reel. Trial reels start without your followers, so compare them with each other more than with regular reels.`);
  }
  if (w.measured) {
    const rate = w.beat / w.measured;
    sig(rate >= 0.15 ? "up" : rate === 0 && w.measured >= 10 ? "down" : "flat", `${w.beat} of ${w.measured} beat your typical reel`, `${Math.round(rate * 100)}% hit rate. Buzzfy's published figure is 19 in 100 for accounts with 1K to 20K followers.`);
  }
  if (r.followers_cmp) {
    const pw = r.followers_cmp.per_week;
    sig(pw > 0 ? "up" : pw < 0 ? "down" : "flat", `${pw >= 0 ? "+" : ""}${num(Math.round(pw))} followers a week`, `Since ${fmtDate(r.followers_cmp.since_day + "T12:00:00Z")}. Followers come from many things, so read this together with reach.`);

  return rows.join("");
}

    <div class="row"><div class="txt"><div class="t">Shares and saves</div><div class="s">From trial reels in this period</div></div><div class="qtime">${h(num(w.shares))} · ${h(num(w.saves))}</div></div>
    <div class="row"><div class="txt"><div class="t">Failed attempts</div><div class="s">Last 30 days, nothing was posted for these</div></div><div class="qtime">${h(num(r.failed_30))}</div></div>
    <div class="row"><div class="txt"><div class="t">Free GitHub minutes this month</div><div class="s">${r.minutes ? `${h(num(r.minutes.runs))} runs` : "Estimated"}. The free plan includes 2,000.</div></div><div class="qtime">${h(num(r.minutes ? r.minutes.used : m30))}</div></div>
    <div class="row"><div class="txt"><div class="t">Safety checks</div><div class="s">${r.guard && r.guard.paused ? h((r.guard.reasons || []).join(" ")) : "All clear"}</div></div><span class="chip ${r.guard && r.guard.paused ? "amber" : "green"}">${r.guard && r.guard.paused ? "Paused" : "OK"}</span></div>
  </div>`;
  if (!ST.posts.length) return html + `</section><div class="empty gut"><h2>No trial reels yet</h2><p>When the app posts one, it shows up here with its results.</p></div>`;
  html += `<div class="sec">ALL TRIAL REELS</div><div class="list">` + ST.posts.map((p) => {
    const m = byId(p.source_id) || { id: p.source_id, thumb: p.thumb };
    const chip = p.status === "posted" ? "" : p.status === "failed" ? '<span class="chip red">Failed</span>' : '<span class="chip blue">Posting</span>';
    return `<div class="row"><div class="thumb" style="${tileBg(m)}"></div><div class="txt">
      <div class="t">${h(recipeLabel(p.recipe || (p.style ? [p.style] : [])) || "Trial reel")}</div>
      <div class="s">${h(fmtTime(p.created_at))}, version ${(p.use_index ?? 0) + 1}${p.sub_style ? ", " + h(SUB_LABEL[p.sub_style] || p.sub_style) + " subtitles" : ""}${p.trigger === "manual" ? ", posted by you" : ""}${p.variant_permalink ? ` · <a href="${h(p.variant_permalink)}" target="_blank" rel="noopener">Open</a>` : ""}</div>
      ${p.status === "posted" ? metricsLine(p) : ""}
      ${p.status === "failed" ? `<div class="s" style="color:var(--danger)">${h(p.error || "")}</div>` : ""}</div>${chip}</div>`;
  }).join("") + `</div></section>`;
  return html;
}

/* ---------- sheet ---------- */
function renderLayer() {
  const layer = document.getElementById("layer");
  let html = "";
  if (ST.sheet) {
    const m = byId(ST.sheet);
    if (m) html += sheetHtml(m);
  }
  if (ST.toast) html += `<div class="toast" role="status">${h(ST.toast)}</div>`;
  layer.innerHTML = html;
  const pv = document.getElementById("pv");
  if (pv && !DEMO) BACK.previewUrl(pv.dataset.id, pv.dataset.made).then((url) => {
    pv.src = url; const n = document.getElementById("pvnote"); if (n) n.remove();
  }).catch((e) => { const n = document.getElementById("pvnote"); if (n) n.textContent = e.message; });
}
function sheetHtml(m) {
  const set = ST.state.settings, st = m.status, busy = !!ST.state.job;
  const hist = ST.posts.filter((p) => p.source_id === m.id);
  const cap = m.variants_override || set.variants_per_post;
  const prev = m.preview;
  let html = `<div class="scrim" data-act="close-bg"><div class="sheet gut" role="dialog" aria-modal="true" aria-label="Reel controls">
    <div class="handle"></div>
    <div class="shead"><div class="thumb" style="${tileBg(m)}"></div><div class="meta">
      <div class="v">${h(num(m.views))} views</div><div class="s" style="color:var(--muted);font-size:13px">Posted ${h(fmtDate(m.timestamp))}${m.permalink ? ` · <a href="${h(m.permalink)}" target="_blank" rel="noopener">Open in Instagram</a>` : ""}</div>
      <div class="cap">${h(m.caption)}</div></div>
      <button class="iconbtn" data-act="close" aria-label="Close">${I.x}</button></div>
    <div class="chips">${statusChip(m)}<span class="chip">${st.uses} of ${st.cap} variants made</span>${st.winner ? '<span class="chip green">Last version won</span>' : ""}</div>
    ${m.next_recipe ? `<p class="s" style="margin:6px 0 0">Next edit: <b>${h(recipeLabel(m.next_recipe))}</b></p>` : (m.analysis ? "" : `<p class="note">The edit is picked when the first version is made: the app listens to the reel and checks for text on screen.</p>`)}
    ${m.analysis && m.analysis.opening ? `<p class="s" style="margin:6px 0 0;color:var(--muted)">Strongest line: "${h(m.analysis.opening.text)}"</p>` : ""}
    ${m.analysis && m.analysis.comment ? `<p class="s" style="margin:6px 0 0;color:var(--muted)">Comment card: "${h(m.analysis.comment.text)}"</p>` : ""}
    <div class="list">
      <div class="row"><div class="txt"><div class="t">Use for trial reels</div><div class="s">${m.excluded ? "Omitted, it will never be reposted" : "Included"}</div></div>${sw("inc", !m.excluded, "include", `data-id="${h(m.id)}"`)}</div>
      <div class="row"><div class="txt"><div class="t">Prioritize</div><div class="s">${m.priority != null ? `#${rankOf(m)} in your priority order, goes before reels ranked by views` : "Goes before reels ranked by views"}</div></div>${sw("pri", m.priority != null, "prioritize", `data-id="${h(m.id)}"`)}</div>
      <div class="row"><div class="txt"><div class="t">Variants of this reel</div><div class="s">${m.variants_override ? `Custom. <button class="btn danger" style="padding:0;font-size:13px" data-act="reset-variants" data-id="${h(m.id)}">Use default (${set.variants_per_post})</button>` : `Default for all reels`}</div></div>
        ${stepper("variants:" + m.id, cap, 1, 20, "Variants of this reel")}</div>
    </div>`;
  if (m.licensed && !m.has_original) {
    html += `<div class="confirm"><div class="t" style="font-weight:600">This reel uses music from Instagram's library</div>
      <div class="s" style="color:var(--muted);font-size:13px">Instagram won't hand over the video file. Upload your own original (without the licensed track) to include it.</div>
      <input type="file" id="orig" accept="video/*" data-act="upload" data-id="${h(m.id)}" ${DEMO ? "disabled" : ""}></div>`;
  }
  if (prev) {
    html += `<div class="preview"><div style="font-weight:600">Next version: ${h(recipeLabel(prev.recipe || (prev.style ? [prev.style] : [])))}</div>
      ${DEMO ? `<div class="fakevid" style="${tileBg(m)}">${h(prev.hook || "")}</div>` : `<video id="pv" data-id="${h(m.id)}" data-made="${h(prev.made_at)}" controls playsinline preload="metadata"></video><div class="note" id="pvnote">Loading the video</div>`}
      <div class="s" style="color:var(--muted);font-size:13px">${[prev.dead_air_cuts ? prev.dead_air_cuts + " pauses cut" : "", prev.speed && prev.speed !== 1 ? Math.round((prev.speed - 1) * 100) + "% faster" : "", prev.sub_style ? (SUB_LABEL[prev.sub_style] || prev.sub_style) + " subtitles" : "", prev.background ? prev.background + " background" : "", prev.music ? "music: " + prev.music : ""].filter(Boolean).map(h).join(", ")}</div>
      <label class="t" for="capedit" style="font-size:13px">Caption</label>
      <textarea class="field" id="capedit">${h(m.next_caption || prev.caption)}</textarea>
      <div><button class="btn" data-act="save-caption" data-id="${h(m.id)}">Save caption</button></div></div>`;
  }
  if (ST.confirm) {
    html += `<div class="confirm"><div style="font-weight:600">Post this as a trial reel now?</div>
      <div class="s" style="color:var(--muted);font-size:13px">It goes to non-followers first and counts toward today's ${set.posts_per_day}.${prev ? " It uses the preview above." : ""}</div>
      <div class="btns" style="padding:0"><button class="btn" data-act="confirm-no">Cancel</button><button class="btn primary" data-act="post-now" data-id="${h(m.id)}">Post</button></div></div>`;
  } else {
    const can = !m.excluded && (!m.licensed || m.has_original) && st.uses < st.cap;
    html += `<div class="btns"><button class="btn" data-act="preview" data-id="${h(m.id)}" ${busy || !can ? "disabled" : ""}>${prev ? "New preview" : "Preview next variant"}</button>
      <button class="btn primary" data-act="confirm" ${busy || !can ? "disabled" : ""}>Post now</button></div>`;
  }
  if (hist.length) {
    const tot = hist.filter((p) => p.variant_views != null).reduce((a, p) => a + p.variant_views, 0);
    html += `<div class="sec">MADE FROM THIS REEL</div><p class="s" style="margin:0 0 4px">${h(num(tot))} views from ${hist.filter((p) => p.status === "posted").length} trial reels${m.views ? `, ${Math.round((tot / m.views) * 100)}% on top of the original` : ""}</p><div class="list">` + hist.map((p) => `<div class="row"><div class="txt"><div class="t">${h(recipeLabel(p.recipe || (p.style ? [p.style] : [])) || "Trial reel")}</div>
      <div class="s">${h(fmtTime(p.created_at))}${p.status !== "posted" ? ", " + h(p.status) : ""}</div>${p.status === "posted" ? metricsLine(p) : ""}</div>
      ${p.variant_permalink ? `<a href="${h(p.variant_permalink)}" target="_blank" rel="noopener">Open</a>` : ""}</div>`).join("") + `</div>`;
  }
  return html + `</div></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "close-bg") { if (e.target === el) { ST.sheet = null; ST.confirm = false; renderLayer(); } return; }
  if (el.tagName === "INPUT" && el.type !== "radio") return; // handled on change
  switch (act) {
    case "nav": ST.view = el.dataset.view; ST.sheet = null; try { localStorage.setItem("trs-view", ST.view); } catch (err) {}
      if (ST.view === "settings") await api("GET", "/api/log").then((d) => (ST.log = d.log)).catch(() => {});
      window.scrollTo(0, 0); render(); break;
    case "filter": ST.filter = el.dataset.f; renderTop(); break;
    case "range": ST.range = el.dataset.r; renderTop(); break;
    case "open": ST.sheet = id; ST.confirm = false; renderLayer(); break;
    case "close": ST.sheet = null; ST.confirm = false; renderLayer(); break;
    case "sync": start("/api/sync", "Sync"); break;
    case "step": {
      const key = el.dataset.key, d = +el.dataset.d;
      if (key.startsWith("variants:")) {
        const mid = key.slice(9), m = byId(mid), cur = m.variants_override || ST.state.settings.variants_per_post;
        await patchMedia(mid, { variants_override: Math.max(1, Math.min(20, cur + d)) });
      } else await saveSetting(key, ST.state.settings[key] + d);
      break;
    }
    case "edit-type": {
      const cur = ST.state.settings.edits || [], k = el.dataset.edit;
      await saveSetting("edits", cur.includes(k) ? cur.filter((x) => x !== k) : cur.concat(k)); break;
    }
    case "music": await saveSetting("music", el.value); break;
    case "del-music":
      try { await api("DELETE", "/api/music/" + encodeURIComponent(el.dataset.name)); toast("Removed"); await load(true); } catch (err) { toast(err.message); }
      break;
    case "resume-guard":
      try { await api("POST", "/api/guard/resume"); toast("Posting resumed"); await load(true); } catch (err) { toast(err.message); }
      break;
    case "save-caption":
      try { await api("POST", `/api/media/${id}/caption`, { caption: document.getElementById("capedit").value }); toast("Caption saved for this version"); await load(true); } catch (err) { toast(err.message); }
      break;
    case "grad": await saveSetting("graduation_strategy", el.value); break;
    case "move": {
      const pri = ST.media.filter((m) => m.priority != null).sort((a, b) => a.priority - b.priority).map((m) => m.id);
      const i = pri.indexOf(id), j = i + +el.dataset.d;
      if (j < 0 || j >= pri.length) break;
      [pri[i], pri[j]] = [pri[j], pri[i]];
      try { await api("POST", "/api/priority", { ids: pri }); await load(true); } catch (err) { toast(err.message); }
      break;
    }
    case "unstar": await patchMedia(id, { prioritized: false }); break;
    case "reset-variants": await patchMedia(id, { variants_override: null }); break;
    case "preview": start(`/api/media/${id}/preview`, "Preview"); break;
    case "confirm": ST.confirm = true; renderLayer(); break;
    case "confirm-no": ST.confirm = false; renderLayer(); break;
    case "post-now": ST.confirm = false; start(`/api/media/${id}/post`, "Posting"); break;
    case "edit": ST.editing[el.dataset.k] = true; renderTop(); break;
    case "save-ig": {
      const v = document.getElementById("igtok").value.trim();
      if (!v) { toast("Paste the token first"); break; }
      try { toast("Saving"); await api("POST", "/api/secrets", { ig_token: v }); ST.editing.ig = false; toast("Saved. Syncing your reels, about a minute."); ST.busyAction = "Sync"; wasBusy = true; await load(true); setTimeout(poll, 4000); }
      catch (err) { toast(err.message); }
      break;
    }
    case "save-claude": {
      const v = document.getElementById("clkey").value.trim();
      try { await api("POST", "/api/secrets", { anthropic_key: v }); ST.editing.claude = false; toast(v ? "Key saved" : "Key removed"); await load(false); }
      catch (err) { toast(err.message); }
      break;
    }
    case "refresh-token":
      try { const d = await api("POST", "/api/refresh-token"); toast(d.refreshed ? "Renewal started on GitHub" : "Too soon to renew. Instagram needs it to be a day old."); ST.busyAction = "Renewal"; wasBusy = true; await load(false); setTimeout(poll, 4000); }
      catch (err) { toast(err.message); }
      break;
    case "logout": BACK.disconnect(); location.reload(); break;
  }
});
document.addEventListener("change", async (e) => {
  const el = e.target, act = el.dataset && el.dataset.act;
  if (!act) return;
  const id = el.dataset.id;
  if (act === "enabled") await saveSetting("enabled", el.checked);
  if (act === "include") await patchMedia(id, { excluded: !el.checked });
  if (act === "prioritize") await patchMedia(id, { prioritized: el.checked });
  if (act === "ai") await saveSetting("caption_mode", el.checked ? "ai" : "original");
  if (act === "mentions") await saveSetting("strip_mentions", el.checked);
  if (act === "backup") await saveSetting("backup_host", el.checked);
  if (act === "winners") await saveSetting("winners_first", el.checked);
  if (act === "hookmove") await saveSetting("hook_mode", el.checked ? "move" : "repeat");
  if (act === "deadair") await saveSetting("cut_dead_air", el.checked);
  if (act === "pacing") await saveSetting("vary_pacing", el.checked);
  if (act === "commenter") await saveSetting("show_commenter", el.checked);
  if (act === "guardrails") await saveSetting("guardrails", el.checked);
  if (act === "upload-music" && el.files[0]) {
    const fd = new FormData(); fd.append("file", el.files[0]);
    toast("Uploading");
    try { await api("POST", "/api/music", fd); toast("Track added"); await load(true); } catch (err) { toast(err.message); }
  }
  if (act === "time" && el.value) await saveSetting(el.dataset.key, el.value);
  if (act === "tz") await saveSetting("timezone", el.value);
  if (act === "voice") await saveSetting("voice", el.value);
  if (act === "upload" && el.files[0]) {
    const fd = new FormData(); fd.append("file", el.files[0]);
    toast("Uploading");
    try { await api("POST", `/api/media/${id}/original`, fd); toast("Original saved"); await load(true); } catch (err) { toast(err.message); }
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ST.sheet) { ST.sheet = null; ST.confirm = false; renderLayer(); } });

function renderSetup(err) {
  document.getElementById("nav").innerHTML = "";
  const repo = (BACK && BACK.repo()) || "";
  document.getElementById("app").innerHTML = `<header class="top gut"><h1>Trial Reels Studio</h1></header>
  <section class="gut" style="padding-block:24px;display:grid;gap:14px;max-width:460px">
    <h2 style="margin:0;font-size:22px">Connect this device</h2>
    <p class="s" style="margin:0;color:var(--muted)">Paste the GitHub token you made for this app. It stays on this device and only works with your private studio repository.</p>
    <label class="t" for="srepo">Repository</label><input class="field" id="srepo" value="${h(repo)}" placeholder="your-name/trial-reels-studio" autocomplete="off">
    <label class="t" for="stok">GitHub token</label><input class="field" id="stok" type="password" placeholder="github_pat_..." autocomplete="off">
    ${err ? `<p class="note" style="color:var(--danger)">${h(err)}</p>` : ""}
    <button class="btn primary" data-act="connect" id="sgo">Connect</button>
  </section>`;
}
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act=connect]");
  if (!el) return;
  el.disabled = true; el.textContent = "Connecting";
  try { await BACK.connect(document.getElementById("stok").value, document.getElementById("srepo").value); boot(); }
  catch (err) { renderSetup(err.message); }
});
function boot() {
  if (!DEMO && !BACK.configured()) { renderSetup(); return; }
  load(true).then(() => { wasBusy = !!(ST.state && ST.state.job); setTimeout(poll, wasBusy ? 4000 : 30000); })
    .catch((e) => {
      if (!DEMO && /token|Reconnect/i.test(e.message)) { renderSetup(e.message); return; }
      document.getElementById("app").innerHTML = `<div class="empty gut"><h2>Couldn't load</h2><p>${h(e.message)}</p></div>`;
    });
}
boot();
})();
</script>
</body>
</html>
